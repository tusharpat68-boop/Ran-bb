name: CYBER RUNNER Android Build (APK & AAB)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_format:
        description: 'Android output format'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      version_name:
        description: 'App versionName (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
      include_armv7:
        description: 'Include 32-bit ARMv7 alongside ARM64 (for legacy 32-bit Android phones)'
        required: false
        default: false
        type: boolean
      require_signing:
        description: 'Fail build if release keystore secrets are missing (enable for Play Store builds)'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android (${{ inputs.build_format || 'apk' }} v${{ inputs.version_name || '1.0.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pre-flight verify project path & Unity license secrets
        id: preflight
        env:
          RAW_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          RAW_UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          RAW_UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          RAW_UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          RAW_UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
          RAW_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f "ProjectSettings/ProjectVersion.txt" ] || [ ! -f "Packages/manifest.json" ]; then
            echo "::error::Unity project root files (ProjectSettings/ProjectVersion.txt, Packages/manifest.json) are missing at repo root."
            echo "Make sure you pushed the contents INSIDE ~/CyberRunner to the repository root, not a nested CyberRunner/ subfolder."
            exit 1
          fi

          python3 - << 'PY'
          import os, base64, secrets

          lic = os.environ.get("RAW_UNITY_LICENSE", "").strip()
          email = os.environ.get("RAW_UNITY_EMAIL", "").strip()
          pwd = os.environ.get("RAW_UNITY_PASSWORD", "").strip()
          serial = os.environ.get("RAW_UNITY_SERIAL", "").strip()
          server = os.environ.get("RAW_UNITY_LICENSING_SERVER", "").strip()
          has_ks = bool(os.environ.get("RAW_KEYSTORE_B64", "").strip())

          out_path = os.environ["GITHUB_OUTPUT"]
          env_path = os.environ["GITHUB_ENV"]

          with open(out_path, "a", encoding="utf-8") as out:
              out.write(f"has_keystore={'true' if has_ks else 'false'}\n")

          # Strategy 1: Licensing Server
          if server:
              print("Unity Licensing: using UNITY_LICENSING_SERVER.")
              raise SystemExit(0)

          # Strategy 2: Pro / Plus Serial
          if serial and email and pwd:
              print("Unity Licensing: using UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD.")
              raise SystemExit(0)

          # Strategy 3: Personal License (.ulf XML or Base64-encoded .ulf XML)
          if lic:
              missing = []
              if not email:
                  missing.append("UNITY_EMAIL")
              if not pwd:
                  missing.append("UNITY_PASSWORD")
              if missing:
                  print(f"::error::UNITY_LICENSE is set, but required Unity account secret(s) are missing: {', '.join(missing)}.")
                  print("Per GameCI v4 Personal License docs, set UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD in GitHub Secrets.")
                  raise SystemExit(1)

              resolved_xml = None
              if "<root" in lic or "<?xml" in lic:
                  resolved_xml = lic
                  print("Unity Licensing: using raw XML UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD.")
              else:
                  try:
                      decoded = base64.b64decode(lic).decode("utf-8")
                      if "<root" in decoded or "<?xml" in decoded:
                          resolved_xml = decoded
                          print("Unity Licensing: decoded Base64 UNITY_LICENSE into XML cleanly.")
                  except Exception:
                      pass

              if resolved_xml:
                  for line in resolved_xml.splitlines():
                      if line.strip():
                          print(f"::add-mask::{line}")
                  delim = "UNITY_LIC_" + secrets.token_hex(12)
                  with open(env_path, "a", encoding="utf-8") as envf:
                      envf.write(f"RESOLVED_UNITY_LICENSE<<{delim}\n{resolved_xml}\n{delim}\n")
                  raise SystemExit(0)

              print("::error::UNITY_LICENSE secret is set, but its contents are not valid Unity_lic.ulf XML (nor Base64-encoded XML).")
              raise SystemExit(1)

          print("::error::Missing valid Unity license GitHub Secrets.")
          print("Required secrets in GitHub -> Settings -> Secrets and variables -> Actions:")
          print("  - Unity Personal (free): UNITY_LICENSE (contents of Unity_lic.ulf from Unity Hub) + UNITY_EMAIL + UNITY_PASSWORD")
          print("  - OR Unity Pro/Plus:     UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD")
          print("  - OR Licensing Server:   UNITY_LICENSING_SERVER")
          print("See RELEASE_GUIDE.md for current GameCI v4 setup instructions.")
          raise SystemExit(1)
          PY

      - name: Free disk space on Ubuntu runner for Unity 6 Android image
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Build CYBER RUNNER APK
        if: ${{ (inputs.build_format || 'apk') == 'apk' || inputs.build_format == 'both' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.RESOLVED_UNITY_LICENSE || secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.0.86f1
          targetPlatform: Android
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}
          allowDirtyBuild: true
          buildName: CyberRunner-v${{ inputs.version_name || '1.0.0' }}
          buildsPath: build-apk
          versioning: Custom
          version: ${{ inputs.version_name || '1.0.0' }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          androidKeystoreName: ${{ steps.preflight.outputs.has_keystore == 'true' && 'user.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildMethod: CyberRunner.Editor.CyberRunnerBuildPipeline.BuildAndroid
          customParameters: >-
            -includeArmV7 ${{ inputs.include_armv7 || false }}
            -requireSigning ${{ inputs.require_signing || false }}

      - name: Build CYBER RUNNER Play Store AAB
        if: ${{ inputs.build_format == 'aab' || inputs.build_format == 'both' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.RESOLVED_UNITY_LICENSE || secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.0.86f1
          targetPlatform: Android
          unityLicensingServer: ${{ secrets.UNITY_LICENSING_SERVER }}
          allowDirtyBuild: true
          buildName: CyberRunner-v${{ inputs.version_name || '1.0.0' }}
          buildsPath: build-aab
          versioning: Custom
          version: ${{ inputs.version_name || '1.0.0' }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidAppBundle
          androidKeystoreName: ${{ steps.preflight.outputs.has_keystore == 'true' && 'user.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildMethod: CyberRunner.Editor.CyberRunnerBuildPipeline.BuildAndroid
          customParameters: >-
            -includeArmV7 ${{ inputs.include_armv7 || false }}
            -requireSigning ${{ inputs.require_signing || false }}

      - name: Verify artifacts & compute SHA-256 checksums
        run: |
          mkdir -p release-output
          find build-apk build-aab -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp -v {} release-output/ \; 2>/dev/null || true
          if [ -z "$(ls -A release-output)" ]; then
            echo "::error::No .apk or .aab artifact was produced!"
            ls -laR build-apk build-aab 2>/dev/null || true
            exit 1
          fi
          cd release-output
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f user.keystore

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberRunner-Android-v${{ inputs.version_name || '1.0.0' }}-build${{ github.run_number }}
          path: release-output
          retention-days: 30
